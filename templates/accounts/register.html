{% extends 'base.html' %}

{% block title %}Register - SwiftCart{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <i class="fas fa-user-plus text-5xl text-primary-600 dark:text-primary-400 mb-4"></i>
                <h2 class="text-3xl font-bold">Create Account</h2>
                <p class="text-gray-600 dark:text-gray-400 mt-2">Join SwiftCart today!</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_username" class="block text-sm font-medium mb-2">Username</label>
                    <input type="text" name="username" id="id_username" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                </div>
                
                <div class="mb-4">
                    <label for="id_password1" class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" name="password1" id="id_password1" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                </div>
                
                <div class="mb-6">
                    <label for="id_password2" class="block text-sm font-medium mb-2">Confirm Password</label>
                    <input type="password" name="password2" id="id_password2" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                </div>
                
                <button type="submit" class="w-full px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-lg transition transform hover:scale-105">
                    <i class="fas fa-user-plus mr-2"></i>Create Account
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-gray-600 dark:text-gray-400">
                    Already have an account? 
                    <a href="{% url 'accounts:login' %}" class="text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 font-semibold">
                        Login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
